spring.application.name=frame
##应用名称

server.port=8888
##项目端口

server.tomcat.uri-encoding=utf-8
##字符编码类型
spring.aop.proxy-target-class=true

spring.aop.auto=true
##配置数据库
spring.datasource.name=crush
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/crush?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

mybatis.type-aliases-package=frame.server.domain
##文件上传请求大小
spring.http.multipart.maxFileSize=10MB
spring.http.multipart.maxRequestSize=10MB
##邮箱配置
spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
spring.mail.port=${MAIL_PORT:25}
